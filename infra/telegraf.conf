[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN"
  organization = "$DOCKER_INFLUXDB_INIT_ORG"
  bucket = "$DOCKER_INFLUXDB_INIT_BUCKET"

[[inputs.system]]

[[inputs.cpu]]

[[inputs.mem]]

[[inputs.net]]

[[inputs.mqtt_consumer]]
  servers     = ["tcp://mosquitto:1883"]
  topics      = ["#"]
  data_format = "value"
  data_type   = "string"
  name_override = "mqtt_raw"
  max_undelivered_messages = 50000
  persistent_session = true
  client_id = "telegraf"

[[processors.starlark]]
  namepass = ["mqtt_raw"]
  source='''
load("logging.star", "log")
load("json.star", "json")

def flatten(prefix, value, out):
  if type(value) == "dict":
    for k, v in value.items():
      new_key = prefix + "_" + k if prefix else k
      flatten(new_key, v, out)
  elif type(value) == "list":
    for i in range(min(len(value), 5)):
      flatten(prefix + "_" + str(i), value[i], out)
  else:
    out[prefix] = value

def coerce(value):
  t = type(value)
  if t == "bool":
    return 1 if value else 0
  if t == "int" or t == "float" or t == "string":
    return value
  return None

def parse_json(metric):
  data = json.decode(metric.fields["value"])
  if type(data) == "dict":
    flat = {}
    flatten("", data, flat)
    for k, v in flat.items():
      cv = coerce(v)
      if cv != None:
        metric.fields[k] = cv
  return metric

def parse_float_fallback(metric):
  if "value" in metric.fields:
    x = float(metric.fields["value"])
    metric.fields["value"] = x
  return metric

def parse_bool_fallback(metric):
  if "value" in metric.fields:
    x = metric.fields["value"]
    if type(x) == "string":
      xl = x.lower()
      if xl == "true" or xl == "on":  metric.fields["value"] = 1
      if xl == "false" or xl == "off": metric.fields["value"] = 0
  return metric

def set_name(metric):
  metric.name = metric.tags["topic"]

def apply(metric):
  catch(lambda: set_name(metric))
  parse_json(metric)
  catch(lambda: parse_float_fallback(metric))
  catch(lambda: parse_bool_fallback(metric))
  return metric
'''